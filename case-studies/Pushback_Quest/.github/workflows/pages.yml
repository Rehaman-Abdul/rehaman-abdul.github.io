name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/configure-pages@v5.0.0
      # The site is static and needs no build. Stage only the files the game
      # loads, so tests, tools and docs are not published. All paths are
      # relative, so the site works from /<repository-name>/.
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html assets css js content _site/
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
